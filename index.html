<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SONIC_LAB - Sound Kit Marketplace</title>
    <meta name="description" content="Sound kit marketplace and producer terminal featuring audio packs, sample preview waveforms, producer studio, and kit catalog" />
    <meta property="og:title" content="SONIC_LAB - Sound Kit Marketplace" />
    <meta property="og:description" content="Sound kit marketplace and producer terminal featuring audio packs, sample preview waveforms, producer studio, and kit catalog" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sonic_lab_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'dark' || (!saved && prefersDark)) ? 'dark' : 'light';
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-on-background">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
